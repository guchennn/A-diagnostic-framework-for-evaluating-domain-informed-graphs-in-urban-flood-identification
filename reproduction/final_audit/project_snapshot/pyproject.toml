[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "floodgnn-ceus"
version = "0.1.0"
description = "Performance-blind Phase 1 data pipeline for the FloodGNN CEUS protocol"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "affine",
    "numpy",
    "pandas",
    "pyarrow",
    "geopandas",
    "shapely",
    "pyproj",
    "rasterio",
    "scipy",
    "xarray",
    "h5netcdf",
    "h5py",
    "earthaccess",
    "idna",
    "requests",
    "PyYAML",
    "psutil",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
figures = [
    "matplotlib>=3.11.1",
    "pillow>=12.3.0",
]
train = [
    "lightgbm",
    "scikit-learn",
    "torch==2.8.0",
    "torch-geometric==2.7.0",
    "xgboost",
]

[project.scripts]
floodgnn = "floodgnn_ceus.cli:main"

[tool.pytest.ini_options]
addopts = "-m 'not live_network'"
markers = [
    "live_network: tests that access remote services and are excluded by default",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
