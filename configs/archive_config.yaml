schema_version: 1
package_name: FloodGNN-CEUS-reproduction
static_allowlist:
  - AGENTS.md
  - README.md
  - pyproject.toml
  - uv.lock
  - configs
  - src
  - tests
  - scripts/autodl
  - figures
  - docs/data_availability.md
public_result_allowlist:
  - inference_long.parquet
  - conclusions.json
  - inference_manifest.json
  - e3e_diagnostics.parquet
  - source_data
  - figures
  - tables
forbidden_path_parts:
  - data/raw
  - data/interim
  - data/manual
  - artifacts/remote_runs
  - artifacts/runtime
  - credentials
  - .env
forbidden_columns:
  - grid_id
  - raw_id
  - report_text
  - toponym
  - longitude
  - latitude
  - geometry
  - member_row_hashes
  - member_count
required_records:
  - artifacts/protocol_lock.json
  - artifacts/environment_lock.json
