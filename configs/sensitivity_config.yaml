schema_version: 1
protocol_id: FloodGNN-CEUS-ZZ-BJ-v1.0
budget: 100
trajectory_ids: ["1", "2", "3"]
candidate_pool: outer-train STRICT-LOC positives
candidate_order: grid_id asc
rng: PCG64DXSM
seed_name: "{protocol_id}/{city}/{outer_fold}/{mechanism}/{trajectory_id}"
sampling: sequential categorical without replacement
mechanisms:
  population-weighted:
    feature: log1p_population_density
    missing: candidate-pool median; all missing becomes 0
    rank: average ties
    weight: "1 + 3 * (rank - 1) / (N - 1)"
    singleton_rank_fraction: 0.5
    maximum_weight_ratio: "4:1"
  clustered:
    first_draw: uniform
    distance: nearest revealed center in projected metres
    weight: "0.2 + 0.8 * exp(-distance / 2000)"
u_sample:
  size: 2000
  master_seed_name: "{protocol_id}/{city}/{outer_fold}/{trajectory_id}/U"
  rule: remove current revealed positives from the corresponding STRICT U-master, then take prefix
inheritance:
  source_selection: corresponding E1 uniform trajectory
  frozen: [model_family, config, epoch, evaluation_banks]
  hpo: forbidden
