name: Reproducibility checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.1"
          python-version: "3.12.11"
          enable-cache: true
      - run: uv sync --frozen --group figures
      - run: uv run ruff check src scripts analysis plots tests
      - run: uv run ruff format --check src scripts analysis plots tests
      - run: uv run --group figures pytest -q --basetemp reproduced/pytest
      - run: uv run python scripts/reproduce_tables.py
      - run: uv run python analysis/seed/verify_aggregate_arithmetic.py
      - run: uv run --group figures python plots/make_result_figures.py --output reproduced/figures
