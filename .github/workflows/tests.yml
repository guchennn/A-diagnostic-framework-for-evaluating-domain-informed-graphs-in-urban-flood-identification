name: Reproducibility checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Create an isolated environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/flood-graph-venv"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "$RUNNER_TEMP/flood-graph-venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$RUNNER_TEMP/flood-graph-venv/bin" >> "$GITHUB_PATH"
          fi
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m ruff check src scripts tests reproduction
      - run: python -m ruff format --check src scripts tests reproduction
      - run: python -m pytest -q --basetemp .pytest_tmp
      - run: python -I -S reproduction/final_audit/scripts/verify_aggregates.py
      - run: python -I -S reproduction/controlled_validation/verify_published.py
      - run: python -I -S reproduction/recovery_audit/verify_records.py
      - run: python -I -S reproduction/selection_alignment/verify_tables.py
      - run: python -I -S reproduction/topology_controls/verify_aggregates.py
      - run: python reproduction/controlled_validation/controlled_ranking/test_validation.py
      - run: python scripts/reproduce_tables.py
      - run: python scripts/check_seed_results.py
      - run: python -m floodgnn_ceus.synthetic_diagnostic_validation --output reproduced/synthetic
      - run: python -m floodgnn_ceus.train plan --output reproduced/plan.json
      - run: python scripts/run_independent_attribute_controls.py plan
      - name: Validate training dependencies
        run: python -m pip install --dry-run -r requirements-train.txt
