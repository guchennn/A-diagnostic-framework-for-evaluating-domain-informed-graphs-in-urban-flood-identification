[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "floodgnn-ceus"
version = "0.1.0"
description = "Reproducible diagnosis of domain-informed graphs for urban flood-record ranking"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "affine",
    "numpy",
    "pandas",
    "pyarrow",
    "geopandas",
    "shapely",
    "pyproj",
    "rasterio",
    "scipy",
    "xarray",
    "h5netcdf",
    "h5py",
    "earthaccess",
    "idna",
    "requests",
    "PyYAML",
    "psutil",
]

[project.scripts]
floodgnn = "floodgnn_ceus.cli:main"

[tool.pytest.ini_options]
addopts = "-m 'not live_network'"
markers = [
    "live_network: tests that access remote services and are excluded by default",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
